[package]
name = "scan-moodle"
version = "0.1.0"
edition = "2024"

[dependencies]
rayon = "1"
walkdir = "2"
mago-syntax = "1.43.0"
mago-database = "1.43.0"
mago-allocator = "1.43.0"
mago-span = "1.43.0"
clap = { version = "4.6.4", features = ["derive"] }
csv = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
roxmltree = "0.21.1"

[profile.release]
lto = true
